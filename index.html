// Les parties de "from" passent sur "to", puis "from" est archivé.
// Une partie où les deux ont joué ensemble reste au nom de "from" (un joueur ne peut pas y figurer deux fois).
function mergeProfiles(fromId, toId) {
  const from = profile(fromId), to = profile(toId);
  if (!from || !to || from === to) return;
  const remap = g => {
    if (!g || g.players.some(p => p.id === toId)) return;
    const e = g.players.find(p => p.id === fromId);
    if (e) Object.assign(e, { id: toId, name: to.name, color: validColor(to.color) });
  };
  db.games.forEach(remap);
  remap(db.current);
  from.deleted = true; from.mergedInto = toId;
  if (!to.photo && from.photo) to.photo = from.photo;
  const s = db.settings.setup;
  if (s && Array.isArray(s.players)) {
    const i = s.players.indexOf(fromId);
    if (i >= 0) { if (s.players.includes(toId)) s.players.splice(i, 1); else s.players[i] = toId; }
  }
  persist.profiles(); persist.games(); persist.current(); persist.settings();
}
function purgeProfile(id, withGames) {
  db.profiles = db.profiles.filter(p => p.id !== id);
  if (withGames) {
    db.games = db.games.filter(g => { const hit = g.players.some(p => p.id === id); if (hit) statCache.delete(g.id); return !hit; });
    if (db.current && db.current.finishedAt && db.current.players.some(p => p.id === id)) { db.current = null; persist.current(); }
    persist.games();
  }
  const s = db.settings.setup;
  if (s) {
    if (Array.isArray(s.players)) s.players = s.players.filter(x => x !== id);
    if (s.hcp) delete s.hcp[id];
    persist.settings();
  }
  persist.profiles();
}

/* ---------- Courbe d'évolution (SVG, survol + clavier) ---------- */
function niceTicks(lo, hi, count) {
  if (lo === hi) { lo -= 1; hi += 1; }
  const step0 = (hi - lo) / count, mag = Math.pow(10, Math.floor(Math.log10(step0))), norm = step0 / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
  const out = [];
  for (let v = Math.floor(lo / step) * step; v <= Math.ceil(hi / step) * step + step / 2; v += step) out.push(+v.toFixed(6));
  return out;
}
function lineChart(series, { label = '', unit = '' } = {}) {
  const pts = series.filter(p => isNum(p.y));
  if (pts.length < 2) return '<p class="hint">La courbe apparaîtra dès 2 parties.</p>';
  const W = Math.round(Math.min(820, Math.max(300, window.innerWidth - 66))), H = 200;
  const pl = 40, pr = 46, pt = 12, pb = 26;
  const ys = pts.map(p => p.y), ticks = niceTicks(Math.min(...ys), Math.max(...ys), 4);
  const lo = ticks[0], hi = ticks[ticks.length - 1];
  const X = i => pl + i * (W - pl - pr) / (pts.length - 1);
  const Y = v => pt + (H - pt - pb) * (1 - (v - lo) / ((hi - lo) || 1));
  const f = v => Number.isInteger(v) ? String(v) : fmt1(v);
  const grid = ticks.map(tv => `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${Y(tv).toFixed(1)}" y2="${Y(tv).toFixed(1)}"/><text class="ax" x="${pl - 8}" y="${(Y(tv) + 4).toFixed(1)}" text-anchor="end">${f(tv)}</text>`).join('');
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(p.y).toFixed(1)}`).join(' ');
  const area = `${d} L${X(pts.length - 1).toFixed(1)} ${H - pb} L${pl} ${H - pb} Z`;
  const dots = pts.length <= 40 ? pts.map((p, i) => `<circle class="pt" cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="4"/>`).join('') : '';
  const last = pts[pts.length - 1];
  const data = pts.map((p, i) => [+X(i).toFixed(1), +Y(p.y).toFixed(1), p.y, p.t]);
  return `<div class="chart" tabindex="0" data-unit="${esc(unit)}" data-w="${W}" data-pts="${esc(JSON.stringify(data))}" aria-label="${esc(label)} : ${pts.length} parties, dernière valeur ${fmt1(last.y)}${esc(unit)}. Flèches gauche et droite pour parcourir.">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-hidden="true">${grid}<path class="area" d="${area}"/><path class="line" d="${d}"/>${dots}
      <text class="endl" x="${(X(pts.length - 1) + 8).toFixed(1)}" y="${(Y(last.y) + 4).toFixed(1)}">${fmt1(last.y)}</text>
      <text class="ax" x="${pl}" y="${H - 6}">${fmtDate(pts[0].t)}</text><text class="ax" x="${W - pr}" y="${H - 6}" text-anchor="end">${fmtDate(last.t)}</text>
      <line class="xh" x1="0" x2="0" y1="${pt}" y2="${H - pb}"/><circle class="hd" r="6" cx="-20" cy="-20"/></svg>
    <div class="chart-tip" hidden></div></div>`;
}
function enhanceCharts() {
  document.querySelectorAll('.chart[data-pts]').forEach(el => {
    const pts = JSON.parse(el.dataset.pts), W = +el.dataset.w, unit = el.dataset.unit || '';
    const svg = el.querySelector('svg'), xh = svg.querySelector('.xh'), hd = svg.querySelector('.hd'), tip = el.querySelector('.chart-tip');
    let idx = -1;
    const show = i => {
      idx = i;
      const [x, y, v, ts] = pts[i];
      xh.setAttribute('x1', x); xh.setAttribute('x2', x); xh.style.opacity = 1;
      hd.setAttribute('cx', x); hd.setAttribute('cy', y); hd.style.opacity = 1;
      const b = document.createElement('b'); b.textContent = fmt1(v) + unit;
      const s = document.createElement('span'); s.textContent = `Partie ${i + 1} · ${fmtDate(ts)}`;
      tip.replaceChildren(b, s); tip.hidden = false;
      const sc = el.clientWidth / W;
      tip.style.left = Math.min(Math.max(x * sc, 70), el.clientWidth - 70) + 'px';
      tip.style.top = (y * sc) + 'px';
    };
    const hide = () => { idx = -1; xh.style.opacity = 0; hd.style.opacity = 0; tip.hidden = true; };
    const nearest = e => {
      const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width;
      let bi = 0, bd = Infinity;
      pts.forEach((p, i) => { const dd = Math.abs(p[0] - x); if (dd < bd) { bd = dd; bi = i; } });
      return bi;
    };
    svg.addEventListener('pointermove', e => show(nearest(e)));
    svg.addEventListener('pointerdown', e => show(nearest(e)));
    svg.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hide(); });
    el.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') show(idx < 0 ? 0 : Math.min(pts.length - 1, idx + 1));
      else if (e.key === 'ArrowLeft') show(idx < 0 ? pts.length - 1 : Math.max(0, idx - 1));
      else if (e.key === 'Escape') hide();
      else return;
      e.preventDefault();
    });
    el.addEventListener('blur', hide);
  });
}

function sanitizeGame(g) {
  if (!g || typeof g.id !== 'string' || !RULES[g.type] || !Array.isArray(g.players) || g.players.length < 1 || g.players.length > 4
    || !Array.isArray(g.darts) || !g.darts.every(c => typeof c === 'string' && CODE_RE.test(c)) || typeof g.finishedAt !== 'number') return null;
  const out = {
    id: g.id.slice(0, 64), type: g.type, opts: normOpts(g.type, g.opts),
    players: g.players.map(p => {
      const e = { id: String(p && p.id).slice(0, 64), name: String((p && p.name) || 'Joueur').slice(0, 24), color: validColor(p && p.color) };
      if (p && Number.isInteger(p.start) && p.start > 1 && p.start <= 1001) e.start = p.start;
      return e;
    }),
    darts: g.darts.slice(), createdAt: +g.createdAt || g.finishedAt, finishedAt: g.finishedAt,
  };
  try { const st = replay(out); if (!st.finished) return null; out.winner = st.winner; } catch (e) { return null; }
  return out;
}
function importData(obj) {
  if (!obj || obj.app !== 'dartscorer' || !Array.isArray(obj.profiles) || !Array.isArray(obj.games)) throw new Error('Ce fichier n\'est pas une sauvegarde DartScorer.');
  const map = {};
  let added = 0, merged = 0, gamesAdded = 0;
  for (const p of obj.profiles) {
    if (!p || typeof p.id !== 'string' || typeof p.name !== 'string' || !p.name.trim()) continue;
    const clean = { id: p.id.slice(0, 64), name: p.name.trim().slice(0, 24), color: validColor(p.color), createdAt: +p.createdAt || Date.now() };
    if (p.deleted) clean.deleted = true;
    if (validPhoto(p.photo)) clean.photo = p.photo;
    // Profil déjà présent : rien n'est écrasé, mais il récupère la photo s'il n'en a pas
    const adopt = x => { if (clean.photo && !x.photo) x.photo = clean.photo; };
    const byId = profile(clean.id);
    if (byId) { adopt(byId); map[p.id] = byId.id; continue; }
    const byName = !clean.deleted && db.profiles.find(x => !x.deleted && x.name.toLowerCase() === clean.name.toLowerCase());
    if (byName) { adopt(byName); map[p.id] = byName.id; merged++; continue; }
    db.profiles.push(clean); map[p.id] = clean.id; if (!clean.deleted) added++;
  }
  const ids = new Set(db.games.map(g => g.id));
  for (const raw of obj.games) {
    const g = sanitizeGame(raw);
    if (!g || ids.has(g.id)) continue;
    g.players.forEach(p => { if (map[p.id]) p.id = map[p.id]; });
    db.games.push(g); ids.add(g.id); gamesAdded++;
  }
  db.games.sort((a, b) => a.finishedAt - b.finishedAt);
  persist.profiles(); persist.games();
  return { added, merged, gamesAdded };
}
function importFile(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const res = importData(JSON.parse(r.result));
      render();
      openModal(`<h3>Import terminé</h3><p>${plural(res.gamesAdded, 'partie importée', 'parties importées')}.<br>${plural(res.added, 'joueur ajouté', 'joueurs ajoutés')}, ${plural(res.merged, 'joueur regroupé', 'joueurs regroupés')} avec un profil existant.</p>
        <div class="actions"><button class="btn primary" data-action="modal-close">OK</button></div>`);
    } catch (e) {
      openModal(`<h3>Import impossible</h3><p class="muted">${esc(e.message || 'Fichier illisible.')}</p><div class="actions"><button class="btn primary" data-action="modal-close">OK</button></div>`);
    }
  };
  r.readAsText(file);
}

      <p class="muted">Le profil est effacé de cet appareil. Impossible de revenir en arrière.${p.deleted ? '' : ' Pour simplement le retirer des listes, archive-le plutôt.'}</p>
      ${n ? `<label class="check"><input type="checkbox" id="purge-games"><span>Effacer aussi ${n > 1 ? `ses ${n} parties` : 'sa partie'}
        <small>Sinon elles restent dans l'historique sous le nom « ${esc(p.name)} ». Effacées, les parties à plusieurs disparaissent aussi des stats des autres joueurs.</small></span></label>` : ''}
      <div class="actions"><button class="btn" data-action="modal-close">Annuler</button>
      <button class="btn danger" data-action="adm-purge-ok" data-id="${esc(p.id)}">Supprimer définitivement</button></div>`);
  },
  'adm-purge-ok': ds => {
    const p = profile(ds.id), box = $('#purge-games');
    closeModal();
    if (!p) return;
    purgeProfile(p.id, !!(box && box.checked));
    if (route().view === 'admin') render(); else go('admin');
    toast('Profil supprimé');
  },

  // Partie
  dart: ds => pushDarts([ds.code]),
  mod: ds => { const m = +ds.m; app.mod = app.mod === m ? 0 : m; render(); },
  'toggle-input': () => { db.settings.input = inputMode() === 'pad' ? 'board' : 'pad'; app.mod = 0; persist.settings(); render(); },
  undo: () => undo(),
  'end-turn': () => {
    const g = db.current;
    if (!g || g.finishedAt) return;
    const t = replay(g).leg.turn;
    if (t) pushDarts(Array(3 - t.darts.length).fill('M'));
  },
  'toggle-voice': () => {
    db.settings.voice = !db.settings.voice; persist.settings(); render();
    if (db.settings.voice) voice.say('Annonces activées');
    else if ('speechSynthesis' in window) speechSynthesis.cancel();
  },
  'game-menu': () => {
    const g = db.current;
    openModal(`<h3>${esc(gameTitle(g))}</h3><p class="muted">${esc(gameSub(g))}</p><div class="menu-list">
      <button class="btn primary block" data-action="modal-close">Continuer la partie</button>
      <button class="btn block" data-action="quit-game">Retour à l'accueil (partie sauvegardée)</button>
      <button class="btn danger block" data-action="abandon-game">Abandonner la partie</button></div>`);
  },
  'quit-game': () => { closeModal(); go(''); },
  'abandon-game': () => confirmBox({ title: 'Abandonner la partie ?', text: 'Elle ne sera pas enregistrée dans l\'historique ni dans les stats.', ok: 'Abandonner', danger: true }, () => {
    db.current = null; persist.current(); go('');
  }),
  rematch: () => {
    const g = db.current;
    if (!g) return;
    const players = [...g.players.slice(1), g.players[0]].map(p => Object.assign({}, p, { name: pname(p), color: pcolor(p) }));
    db.current = { id: uid(), type: g.type, opts: Object.assign({}, g.opts), players, darts: [], createdAt: Date.now() };
    app.mod = 0; persist.current(); render();
    if (players.length > 1) voice.say(`Revanche ! ${players[0].name} commence`);
  },
  'end-new': () => { db.current = null; persist.current(); go('setup'); },
  'end-home': () => { db.current = null; persist.current(); go(''); },

  // Historique
  'delete-game': ds => confirmBox({ title: 'Supprimer cette partie ?', text: 'Elle sera retirée de l\'historique et des stats. Impossible de revenir en arrière.', ok: 'Supprimer', danger: true }, () => {
    db.games = db.games.filter(x => x.id !== ds.id); statCache.delete(ds.id); persist.games(); go('history');
  }),

  // Réglages
  'set-voice': ds => { db.settings.voice = ds.val === 'true'; persist.settings(); render(); },
  'test-voice': () => voice.say('Cent quatre-vingts ! Il te reste 40.', true),
  'set-theme': ds => { db.settings.theme = ds.val; persist.settings(); applyTheme(); render(); },
  'set-input': ds => { db.settings.input = ds.val; persist.settings(); render(); },
  export: () => exportData(),
  wipe: () => confirmBox({ title: 'Tout effacer ?', text: 'Joueurs, historique et partie en cours seront supprimés de cet appareil. Impossible de revenir en arrière.', ok: 'Tout effacer', danger: true }, () => {
    db.profiles = []; db.games = []; db.current = null; db.settings.setup = null; statCache.clear();
    persist.profiles(); persist.games(); persist.current(); persist.settings(); go('');
    toast('Données effacées');
  }),
};
const submits = {
  profile: f => {
    const id = f.dataset.id, name = $('#pname').value.trim().replace(/\s+/g, ' ').slice(0, 24), err = $('#perr');
    const fail = m => { err.textContent = m; err.hidden = false; };
    if (!name) return fail('Donne un nom au joueur.');
    if (db.profiles.some(x => !x.deleted && x.id !== id && x.name.toLowerCase() === name.toLowerCase())) return fail('Ce nom existe déjà.');
    const draft = id ? Object.assign({}, profile(id), { name, color: app.modalColor }) : { id: uid(), name, color: app.modalColor, createdAt: Date.now() };
    if (app.modalPhoto) draft.photo = app.modalPhoto; else delete draft.photo;
    // On vérifie que ça tient dans le stockage avant de modifier quoi que ce soit (une photo peut le remplir)
    const list = id ? db.profiles.map(x => x.id === id ? draft : x) : db.profiles.concat(draft);
    if (storageOK && !trySave('profiles', list)) {
      return fail(app.modalPhoto ? 'Le stockage du navigateur est plein : la photo ne rentre pas. Retire-la, ou libère de la place (photos d\'autres joueurs, anciennes parties).'
        : 'Le stockage du navigateur est plein : impossible d\'enregistrer.');
    }
    let p;
    if (id) { p = profile(id); Object.assign(p, draft); if (!draft.photo) delete p.photo; }
    else { p = draft; db.profiles.push(p); }
    if (!storageOK) persist.profiles();
    closeModal();
    const cb = app.modalSave; app.modalSave = null;
    if (cb) cb(p);
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.action];
  if (fn) fn(el.dataset, el, e);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-submit]');
  if (!f) return;
  e.preventDefault();
  submits[f.dataset.submit](f);
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]');
  if (!el) return;
  if (el.dataset.change === 'hcp') { const s = setupState(); s.hcp[el.dataset.pid] = +el.value; persist.settings(); }
  else if (el.dataset.change === 'import') { importFile(el.files && el.files[0]); el.value = ''; }
  else if (el.dataset.change === 'adm-sort') { app.adm.sort = el.value; render(); }
  else if (el.dataset.change === 'photo') { setModalPhoto(el.files && el.files[0]); el.value = ''; }
});
document.addEventListener('input', e => {
  const el = e.target.closest('[data-input]');
  if (!el) return;
  if (el.dataset.input === 'adm-search') { app.adm.q = el.value; filterAdmin(); }
  else if (el.dataset.input === 'pname' && !app.modalPhoto) refreshPhotoPreview();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modal-root').innerHTML) { closeModal(); return; }
  if (route().view !== 'game' || $('#modal-root').innerHTML || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.key === 'Backspace' || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z')) { e.preventDefault(); undo(); }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && route().view === 'game' && db.current && !db.current.finishedAt) keepAwake(true);
});
let resizeTimer;
window.addEventListener('resize', () => {
  if (!['player'].includes(route().view)) return;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(render, 200);
});
window.addEventListener('hashchange', () => { closeModal(); render(); });
try { matchMedia('(prefers-color-scheme: light)').addEventListener('change', applyTheme); } catch (e) {}

/* =====================================================================
   Démarrage
   ===================================================================== */
if (db.current && (db.current.finishedAt || !RULES[db.current.type] || !Array.isArray(db.current.darts))) { db.current = null; persist.current(); }
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
applyTheme();
render();

// Hors ligne + installation sur l'écran d'accueil (seulement quand la page est servie en http/https)
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

// Accès pour les tests depuis la console
window.DartScorer = { replay, checkout, matchStats, profileStats, db };
})();
</script>
</body>
</html>
