<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05051A">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>DartScorer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='31' fill='%23fff'/%3E%3Ccircle cx='32' cy='32' r='28.5' fill='%230e0e30'/%3E%3Ccircle cx='32' cy='32' r='24' fill='%23ff4f1f'/%3E%3Ccircle cx='32' cy='32' r='20' fill='%232323c8'/%3E%3Ccircle cx='32' cy='32' r='13' fill='%235b5bff'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%23ece9fb'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23ff4f1f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400..800&display=swap">
<script>
  try {
    var t = (JSON.parse(localStorage.getItem('dartscorer.settings') || '{}').theme) || 'auto';
    var d = t === 'dark' || (t === 'auto' && !matchMedia('(prefers-color-scheme: light)').matches);
    document.documentElement.dataset.theme = d ? 'dark' : 'light';
  } catch (e) {}
</script>
<style>
/* Thème « Cible nuit » : fond presque noir, outremer, lilas, vermillon ; formes rondes.
   Le thème clair reprend la même palette sur fond lilas. */
:root{
  color-scheme:dark;
  --bg:#05051A;--surface:#10103A;--surface-2:#17174A;--surface-3:#22225C;--line:#2A2A66;--track:#26265E;
  --text:#ECE9FB;--text-2:#C9C3F0;--muted:#A9A2E6;
  --accent:#FF4F1F;--accent-ink:#0E0E5C;--accent-soft:rgba(255,79,31,.16);--accent-text:#FF6A3D;
  --blue:#2323C8;--blue-2:#5B5BFF;--on-blue:#FFFFFF;--strong:#ECE9FB;--on-strong:#0E0E5C;
  --danger:#FF6B8A;--danger-soft:rgba(255,107,138,.14);
  --gold:#FFB000;--gold-ink:#1A1200;
  --b-rim:#0E0E30;--b-outline:#FFFFFF;--b-s1:#2323C8;--b-s2:#ECE9FB;--b-r1:#FF4F1F;--b-r2:#5B5BFF;--b-wire:#05051A;--b-ob:#5B5BFF;--b-bull:#FF4F1F;--b-num:#ECE9FB;
  --shadow:0 14px 40px rgba(0,0,0,.6);
  --p0:#3987e5;--p1:#d95926;--p2:#199e70;--p3:#c98500;--p4:#d55181;--p5:#0ca30c;--p6:#9085e9;--p7:#e66767;
  --r:24px;
  --fd:"Unbounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#ECE9FB;--surface:#F8F7FF;--surface-2:#FFFFFF;--surface-3:#DCD7F8;--line:#CFC9F2;--track:#D3CEF5;
  --text:#0E0E5C;--text-2:#2B2A6E;--muted:#4B4A8A;
  --accent:#FF4F1F;--accent-ink:#0E0E5C;--accent-soft:rgba(255,79,31,.14);--accent-text:#B8330E;
  --blue:#2323C8;--blue-2:#2323C8;--on-blue:#FFFFFF;--strong:#0E0E5C;--on-strong:#FFFFFF;
  --danger:#C2185B;--danger-soft:rgba(194,24,91,.1);
  --gold:#9A6B00;--gold-ink:#FFFFFF;
  --b-rim:#0E0E5C;--b-outline:#0E0E5C;--b-s1:#2323C8;--b-s2:#F8F7FF;--b-r1:#FF4F1F;--b-r2:#0E0E5C;--b-wire:#ECE9FB;--b-ob:#0E0E5C;--b-bull:#FF4F1F;--b-num:#ECE9FB;
  --shadow:0 12px 30px rgba(14,14,92,.16);
  --p0:#2a78d6;--p1:#eb6834;--p2:#1baf7a;--p3:#eda100;--p4:#e87ba4;--p5:#008300;--p6:#6250d6;--p7:#e34948;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--fd);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
p,.hint,.small,.banner,.note,td,input,select,.check,.chart-tip span,.modal p{font-family:var(--font)}
.ic{width:20px;height:20px;flex:none}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.grow{flex:1;min-width:0}
b,strong{font-weight:700}
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

/* ---------- Pages ---------- */
.page{width:100%;max-width:900px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 32px) max(16px,env(safe-area-inset-left))}
.topbar{display:flex;align-items:center;gap:10px;min-height:56px;margin-bottom:8px}
.topbar h1{font-size:1.15rem;font-weight:700;margin:0;flex:1;min-width:0;letter-spacing:-.01em}
.icon-btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:transparent;flex:none;transition:border-color .12s ease,background-color .12s ease}
.icon-btn:hover:not(:disabled){border-color:var(--muted)}
.icon-btn.solid{background:var(--strong);color:var(--on-strong);border-color:var(--strong)}
.icon-btn.sm{width:38px;height:38px;border-width:1.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;background:var(--surface-2);border:1.5px solid var(--line);font-weight:600;font-size:.88rem;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.btn.ghost{background:none;border-color:transparent;color:var(--text-2)}
.btn.block{display:flex;width:100%}
.btn.big{min-height:60px;font-size:1rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.section{margin-top:24px}
.section>h2,.h2{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 10px;font-weight:600;display:flex;align-items:center;gap:8px}
.count{background:var(--surface-2);color:var(--text-2);border-radius:999px;padding:1px 9px;letter-spacing:0;font-size:.7rem}
.hint{color:var(--muted);font-size:.86rem;margin-top:6px}
.err{color:var(--danger);font-size:.9rem;margin:8px 0 0;font-family:var(--font)}
.banner{background:var(--danger-soft);color:var(--danger);border-radius:18px;padding:10px 16px;margin:10px 0;font-size:.9rem}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* ---------- Accueil ----------
   Tient dans l'écran : la grande cible prend toute la place libre (au milieu en portrait,
   à gauche en paysage) et les boutons restent groupés (en bas, ou à droite). */
.page.home{height:100vh;height:100dvh;display:flex;flex-direction:column;gap:clamp(12px,2.4dvh,28px);overflow:auto;padding-bottom:calc(env(safe-area-inset-bottom) + 16px)}
.home-hero{padding-top:clamp(6px,2dvh,24px)}
.home-hero h1{margin:0;font-size:clamp(1.9rem,4.6dvh,3rem);font-weight:800;letter-spacing:-.04em;line-height:1.05}
.home-hero p{margin:6px 0 0;font-family:var(--fd);font-size:clamp(.8rem,1.6dvh,1rem)}
.home-art{flex:1 1 0;min-height:0;position:relative;container-type:size}
.home-art svg{display:block;width:100%;height:100%;overflow:visible}
@container (max-height:110px){.home-art .dsq{display:none}}
.home-side{display:flex;flex-direction:column;gap:12px;flex:none}
.resume{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border-color:var(--accent);border-radius:999px;padding:12px 12px 12px 26px}
.resume b{font-size:1.05rem}
.eyebrow{font-size:.66rem;text-transform:uppercase;letter-spacing:.12em;color:var(--accent-text);font-weight:600}
.home-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:left;min-height:116px;font-weight:600}
.tile .ic{width:44px;height:44px;padding:10px;border-radius:50%;background:var(--blue);color:var(--on-blue);margin-bottom:8px}
@media (min-width:700px) and (min-height:900px){.page.home .btn.big{min-height:72px;font-size:1.1rem}.tile{min-height:140px;padding:22px}}
/* Téléphone, et colonne de droite en paysage : les raccourcis en lignes */
@media (max-width:560px),(orientation:landscape) and (min-width:700px){.home-grid{grid-template-columns:1fr}.tile{min-height:0;flex-direction:row;align-items:center;gap:14px;border-radius:999px;padding:10px 22px 10px 10px}.tile .ic{margin:0}.tile b{flex:1}}
@media (orientation:landscape) and (min-width:700px){
  .page.home{max-width:1560px;display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,460px);grid-template-rows:1fr auto auto 1fr;grid-template-areas:"art ." "art hero" "art side" "art .";column-gap:clamp(28px,5vw,88px);row-gap:clamp(16px,3dvh,32px);padding-top:calc(env(safe-area-inset-top) + 24px);padding-bottom:calc(env(safe-area-inset-bottom) + 24px)}
  .home-art{grid-area:art}
  .home-hero{grid-area:hero;padding-top:0}
  .home-side{grid-area:side}
  .page.home .btn.big{min-height:68px}
  .tile{min-height:72px;padding:12px 24px 12px 12px}
  .tile .ic{width:48px;height:48px}
}

/* ---------- Nouvelle partie ---------- */
.games{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:620px){.games{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.games .game-card{min-height:56px;padding:4px;border-radius:999px;align-items:center;justify-content:center;text-align:center}.games .game-card span{display:none}.games .game-card b{font-size:.68rem;letter-spacing:-.03em}}
/* Écrans qui tiennent dans la hauteur, sans défilement */
.page.fit{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:auto;padding-bottom:0}
.page.fit .section{margin-top:10px}
.page.fit .section>h2{margin-bottom:8px}
.page.fit .topbar{margin-bottom:0}
.page.fit .sel-list{margin-top:0}
/* Si l'écran est trop court, la page défile et le bouton de lancement reste en bas */
.page.fit .cta{position:sticky;bottom:0;z-index:1;margin-top:auto;padding:12px 0 calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(transparent,var(--bg) 12px)}
.h2-btn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 4px;color:var(--text-2);font:600 .7rem var(--fd);letter-spacing:0;text-transform:none}
.h2-btn .ic{width:16px;height:16px}
.sel-item{min-height:50px}
.sel-item.sel-add{width:100%;border-style:dashed;color:var(--text-2);gap:12px;padding-left:16px;font-weight:600;font-size:.82rem;text-align:left}
/* Règles affichées sur l'écran : libellé à gauche, choix à droite, explication dessous */
.rules{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:10px 14px}
.rules .opt-row{grid-template-columns:150px 1fr;align-items:center;gap:4px 12px;padding:7px 0}
.rules .opt-row:first-child{padding-top:0}
.rules .opt-row:last-child{padding-bottom:0}
.rules .opt-lbl{padding-top:0;font-size:.74rem;color:var(--text-2);line-height:1.25}
.rules .seg button{min-height:40px;padding:0 14px}
.rules .seg button.num{min-width:40px;padding:0 8px}
.rules .hint{grid-column:2;margin-top:0;font-size:.76rem;line-height:1.3}
@media (max-width:560px){
  .rules{padding:8px 12px}
  .rules .opt-row{grid-template-columns:92px 1fr;gap:3px 8px;padding:4px 0}
  .rules .opt-lbl{font-size:.64rem}
  .rules .seg{gap:4px}
  .rules .seg button{min-height:36px;padding:0 10px;font-size:.7rem}
  .rules .seg button.num{min-width:36px;padding:0 6px}
  .rules .hint{grid-column:1/-1;font-size:.72rem}
}
@media (min-width:900px){
  .rules{display:grid;grid-template-columns:1fr 1fr;column-gap:28px;padding:12px 20px}
  .rules .opt-row{grid-template-columns:108px 1fr}
  .rules .opt-row:nth-child(2){border-top:0;padding-top:0}
  .rules .hint{grid-column:1/-1}
}
/* Écrans hauts (tablette en portrait, PC) : tout grandit avec la hauteur,
   pour que la page soit remplie sans laisser un grand vide au-dessus du bouton de lancement */
@media (min-width:700px) and (min-height:900px){
  .page.fit.setup .section{margin-top:clamp(10px,2.2dvh,36px)}
  .page.fit.setup .section>h2{margin-bottom:12px;font-size:.78rem}
  .setup .games{gap:12px}
  .setup .game-card{min-height:clamp(92px,10.5dvh,160px);padding:20px 22px}
  .setup .game-card b{font-size:clamp(1.35rem,2.6dvh,2.1rem)}
  .setup .game-card span{font-size:.92rem}
  .setup .sel-list{gap:8px}
  .setup .sel-item{min-height:clamp(50px,5.6dvh,72px);padding-left:12px}
  .setup .sel-item .ord{width:38px;height:38px;font-size:.9rem}
  .setup .sel-item .nm{font-size:1.02rem}
  .setup .sel-item.sel-add{padding-left:22px;font-size:.92rem}
  .setup .rules{padding:20px 26px}
  .setup .rules .opt-row{padding:11px 0}
  .setup .rules .opt-row:first-child{padding-top:0}
  .setup .rules .opt-row:last-child{padding-bottom:0}
  .setup .rules .opt-lbl{font-size:.84rem}
  .setup .rules .seg{gap:8px}
  .setup .rules .seg button{min-height:46px;padding:0 20px;font-size:.88rem}
  .setup .rules .seg button.num{min-width:46px;padding:0 10px}
  .setup .rules .hint{font-size:.86rem;margin-top:2px}
  .page.fit.setup .cta .btn{min-height:76px;font-size:1.15rem}
}
/* Écran haut : les règles sur une seule colonne (les choix tiennent sur une ligne et remplissent la hauteur) */
@media (min-width:900px) and (min-height:900px){
  .setup .rules{display:block}
  .setup .rules .opt-row{grid-template-columns:170px 1fr}
  .setup .rules .opt-row:nth-child(2){border-top:1px solid var(--line);padding-top:11px}
  .setup .rules .hint{grid-column:2}
}
/* La place qui reste est répartie entre les blocs plutôt que laissée au-dessus du bouton */
.page.fit.setup{justify-content:space-between}
.page.fit.setup .cta{margin-top:0}
.pick-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.pick{display:flex;align-items:center;gap:8px;min-height:52px;padding:4px 10px 4px 4px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface-2);text-align:left;font-weight:600;font-size:.8rem;min-width:0}
.pick .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick.on{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 22%,var(--surface-2))}
.pick .ord{width:26px;height:26px;border-radius:50%;background:var(--pc);color:#fff;display:grid;place-items:center;font-size:.72rem;font-weight:700;flex:none}
.game-card{padding:16px;border-radius:var(--r);background:var(--surface);border:2px solid var(--line);text-align:left;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.game-card b{font-size:1.35rem;font-weight:800;letter-spacing:-.03em}
.game-card span{font-size:.82rem;color:var(--muted);font-family:var(--font)}
.game-card.on{border-color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 18px 0 12px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-weight:600;font-size:.85rem}
.chip .dot{width:12px;height:12px;border-radius:50%;background:var(--pc)}
.chip.on{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 22%,var(--surface))}
.chip.add{border-style:dashed;color:var(--text-2)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--pc);margin-right:8px;vertical-align:middle;flex:none}
.sel-list{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.sel-item{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 8px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line)}
.sel-item .ord{width:30px;height:30px;border-radius:50%;background:var(--pc);color:#fff;display:grid;place-items:center;font-size:.78rem;font-weight:700;flex:none}
.sel-item .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel-item select{min-height:38px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface-2);padding:0 10px;font-weight:600}
.sel-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.opt-row{display:grid;grid-template-columns:150px 1fr;align-items:start;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.opt-row:first-child{border-top:0;padding-top:0}
.opt-row:last-child{padding-bottom:0}
.opt-lbl{font-weight:600;font-size:.85rem;padding-top:13px}
@media (max-width:560px){.opt-row{grid-template-columns:1fr;gap:6px}.opt-lbl{padding-top:0}}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:44px;padding:0 16px;border-radius:999px;background:transparent;border:1.5px solid var(--line);font-weight:600;font-size:.8rem;color:var(--text-2)}
.seg button.on{background:var(--strong);border-color:var(--strong);color:var(--on-strong)}
.cta{position:sticky;bottom:0;padding:14px 0 calc(env(safe-area-inset-bottom) + 6px);background:linear-gradient(transparent,var(--bg) 30%);margin-top:16px}

/* ---------- Listes ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.list-item{display:flex;align-items:center;gap:12px;width:100%;padding:8px 18px 8px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);text-align:left;min-height:60px}
.list-item b{display:block;font-weight:600;font-size:.9rem}
.list-item .small{display:block}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;border:3px solid var(--pc);background:var(--surface-2);flex:none;font-size:.82rem}
.avatar.lg{width:64px;height:64px;font-size:1.15rem;border-width:4px}
.gbadge{min-width:60px;height:44px;padding:0 10px;border-radius:999px;background:var(--blue);color:var(--on-blue);display:grid;place-items:center;font-weight:700;font-size:.72rem;flex:none}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty .btn{margin-top:14px}

/* ---------- Écran de jeu ---------- */
body[data-view="game"]{overscroll-behavior:none}
body[data-view="game"] #app{height:100vh;height:100dvh;overflow:hidden}
.game{flex:1;display:flex;flex-direction:column;min-height:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.g-head{display:flex;align-items:center;gap:8px;padding:8px 12px}
.g-title{flex:1;min-width:0;text-align:center}
.g-title b{display:block;font-size:.95rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-title span{display:block;font-size:.66rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:0 12px 12px}
.g-main{flex:none;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px}
.g-body:not(.split) .g-main{flex:1}
.g-main.narrow{width:100%;max-width:980px;margin:0 auto}
.g-pad{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;justify-content:flex-end}
.legs{display:inline-flex;gap:3px;flex:none}
.legs i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--text-2)}
.legs i.won{background:var(--accent);border-color:var(--accent)}
.tag{font-size:.66rem;padding:2px 9px;border-radius:999px;background:var(--surface-3);color:var(--text)}

/* Joueurs (301/501) : disques avec anneau de progression vers zéro */
.players{display:flex;justify-content:space-around;align-items:flex-end;gap:6px;padding:2px 0}
.pdisc{--d:clamp(62px,10dvh,84px);display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;flex:1 1 0}
.pdisc.is-cur{--d:clamp(82px,14.5dvh,120px)}
.players.n3 .pdisc{--d:clamp(54px,8.5dvh,70px)}.players.n3 .pdisc.is-cur{--d:clamp(70px,11.5dvh,96px)}
.players.n4 .pdisc{--d:clamp(50px,7.5dvh,62px)}.players.n4 .pdisc.is-cur{--d:clamp(64px,10dvh,86px)}
.pdisc .ring{width:var(--d);height:var(--d);border-radius:50%;background:conic-gradient(var(--pc) calc(var(--prog,0) * 1turn),var(--track) 0);display:grid;place-items:center;flex:none}
.pdisc .core{width:calc(var(--d) - var(--d) / 6.5);height:calc(var(--d) - var(--d) / 6.5);border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:calc(var(--d) * .3);font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums;line-height:1}
.pdisc.is-cur .core{background:var(--blue);color:var(--on-blue)}
.pd-name{display:flex;align-items:center;justify-content:center;gap:5px;max-width:100%;min-width:0;font-size:.82rem;font-weight:700}
.pd-name .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pd-meta{font-size:.62rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pd-meta b{color:var(--text-2);font-weight:600}
.players.n3 .pd-last,.players.n4 .pd-last{display:none}
.x01-pad .pad .k{min-height:clamp(54px,7.4vh,72px)}

/* Volée en cours */
.turn{display:flex;align-items:center;gap:8px;min-width:0;padding:2px 0}
.slots{display:flex;gap:7px;flex:none}
.slot{width:46px;height:46px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-weight:700;font-size:.72rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.slot.on{border:0;background:var(--strong);color:var(--on-strong)}
.slot.next{border-color:var(--pc,var(--accent))}
.slot.void{background:var(--surface-2);color:var(--muted);text-decoration:line-through}
.turn-total{font-size:1.55rem;font-weight:800;min-width:44px;font-variant-numeric:tabular-nums;flex:none;letter-spacing:-.03em;padding-left:2px}
.turn-total small{font-size:.75rem;color:var(--muted);margin-left:2px;font-weight:600}
.turn-who{margin-left:auto;text-align:right;min-width:0;line-height:1.25;font-size:.8rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.turn-who small{display:block;color:var(--muted);font-weight:500;font-size:.6rem;text-transform:uppercase;letter-spacing:.1em}
.turn-who.co{padding:6px 14px;border-radius:999px;background:var(--surface-2);font-size:.82rem}
.turn-who.co small{color:var(--accent-text)}
.turn>.avatar{flex:none}
@media (max-width:380px){.slot{width:42px;height:42px}.turn-total{font-size:1.3rem}}

/* Cible de saisie */
.dwrap{flex:1;min-height:0;position:relative;container-type:size;margin:0 -6px}
.dsq{position:absolute;left:50%;top:50%;width:min(100cqw,100cqh);height:min(100cqw,100cqh);transform:translate(-50%,-50%)}
.dboard{display:block;width:100%;height:100%;touch-action:manipulation;user-select:none;-webkit-user-select:none;overflow:visible}
.bsvg .b-rim{fill:var(--b-rim);stroke:var(--b-outline);stroke-width:5}
.bsvg .b-s,.bsvg .b-r,.bsvg .b-ob,.bsvg .b-bull{stroke:var(--b-wire);stroke-width:1.4}
.dboard [data-code]{cursor:pointer;transition:filter .1s ease}
.bsvg .b-s.d{fill:var(--b-s1)}.bsvg .b-s.l{fill:var(--b-s2)}
.bsvg .b-r.d{fill:var(--b-r1)}.bsvg .b-r.l{fill:var(--b-r2)}
.bsvg .b-ob{fill:var(--b-ob)}.bsvg .b-bull{fill:var(--b-bull)}
.dboard [data-code]:hover{filter:brightness(1.18)}
.dboard [data-code]:active{filter:brightness(.8)}
.bsvg .b-num{fill:var(--b-num);font:700 15px var(--fd);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.dboard .b-marks{pointer-events:none}
.dboard .b-hit{fill:#fff;stroke:#05051A;stroke-width:3.5;paint-order:stroke}
.dboard .b-tip-u{fill:none;stroke:#05051A;stroke-width:6}
.dboard .b-tip{fill:none;stroke:#fff;stroke-width:3;stroke-dasharray:6 5}
.d-btn{position:absolute;bottom:0;width:clamp(52px,15cqmin,76px);height:clamp(52px,15cqmin,76px);border-radius:50%;border:2px solid var(--text);background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:.72rem}
.d-btn.d-miss{left:0;border-style:dashed}
.d-btn.d-undo{right:0}
.d-btn .ic{width:24px;height:24px}
.d-legend{position:absolute;right:0;top:0;display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:.58rem;color:var(--muted);pointer-events:none}
.d-legend span{display:flex;align-items:center;gap:6px}
.d-legend i{width:10px;height:10px;border-radius:50%;flex:none}
.d-legend .lg-hit{background:#fff;box-shadow:0 0 0 2px #05051A}
.d-legend .lg-tip{border:2px dashed var(--text)}

/* Pavé de saisie */
.pad{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
.k{min-height:54px;border-radius:999px;background:var(--surface-2);border:1.5px solid var(--line);font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums;user-select:none;-webkit-user-select:none;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .06s ease,background-color .12s ease;line-height:1.1}
.k:active:not(:disabled){transform:scale(.94);background:var(--surface-3)}
.k small{font-size:.65em;color:var(--muted);font-weight:600}
.pad.mod-2 .num,.pad.mod-3 .num{background:color-mix(in srgb,var(--accent) 18%,var(--surface-2));border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.k.mod{font-size:.82rem}
.k.mod.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.k.miss{border-style:dashed;font-size:.82rem}
.k.act{font-size:.82rem;background:transparent;white-space:nowrap}
.k.span2{grid-column:span 2}
.k.span3{grid-column:span 3}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:7px}
.k.go-turn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);min-height:62px;justify-content:space-between;padding:0 8px 0 26px;font-size:.9rem}
.k.go-turn .go{width:46px;height:46px;border-radius:50%;background:var(--accent-ink);color:var(--accent);display:grid;place-items:center}
.k.go-turn:active:not(:disabled){background:var(--accent)}
.acts.cr-acts{grid-template-columns:auto auto minmax(0,1fr)}
.acts.cr-acts .go-turn{grid-column:-2/-1;padding-left:18px;white-space:nowrap;font-size:.8rem}
.acts.cr-acts .k{min-height:clamp(50px,8dvh,62px)}
.acts.cr-acts .k.act,.acts.cr-acts .k.miss{padding:0 18px}
@media (max-width:420px){.acts .k .ic-next{display:none}.acts .k{font-size:.78rem}}
@media (max-height:720px){.k{min-height:46px;font-size:1rem}.k.go-turn{min-height:56px}.slot{width:42px;height:42px}}

/* Cricket */
.t-cricket .g-main{container-type:size}
.crg{--cell:clamp(36px,calc((100cqh - 306px) / 7),58px);--tgw:var(--cell);display:grid;grid-template-columns:var(--tgw) repeat(var(--n),minmax(0,1fr)) repeat(3,var(--cell));gap:8px 6px;align-items:center;padding:6px}
.t-cricket .cr-acts{margin-top:auto}
/* Sans le panneau de stats (téléphone) : les lignes de la grille s'écartent pour remplir la hauteur */
@media (max-width:699px),(max-height:599px){.t-cricket .crg{flex:1 0 auto;align-content:space-evenly}}
.crg .h{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;min-width:0;text-align:center;align-self:end}
.crg .ph .pts-disc{width:clamp(44px,7dvh,62px);height:clamp(44px,7dvh,62px);border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:inset 0 0 0 5px var(--track);font-size:1.15rem;font-weight:800;font-variant-numeric:tabular-nums}
.crg .ph.is-cur .pts-disc{background:var(--blue);color:var(--on-blue);box-shadow:inset 0 0 0 5px var(--pc)}
.crg .ph .nm{font-weight:700;font-size:.74rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crg .ph .sub{font-size:.58rem;color:var(--muted)}
.crg .hb{font-size:.6rem;color:var(--muted);justify-content:center;align-self:center}
.crg .tg{width:var(--tgw);height:var(--tgw);border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.05rem;background:var(--strong);color:var(--on-strong)}
.crg .tg.bull{font-size:.66rem}
.crg .tg.scoring{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--accent)}
.crg .tg.dead{background:transparent;color:var(--text);box-shadow:inset 0 0 0 2px var(--text)}
.crg .m{display:grid;place-items:center;min-height:var(--cell)}
.crg .m svg{width:100%;max-width:var(--cell);height:auto;display:block}
.mk-track{fill:none;stroke:var(--track);stroke-width:5}
.mk-arc{fill:none;stroke:var(--pc);stroke-width:5}
.mk-on{fill:var(--pc)}
.mk-hole{fill:var(--bg)}
.crg .dead{opacity:.35}
.crg .k{width:var(--cell);height:var(--cell);min-height:0;padding:0;border-radius:50%;font-size:.66rem;border:2px solid var(--text);justify-self:center}
.crg .k.ks{background:transparent}
.crg .k.kd{background:var(--surface-2)}
.crg .k.kt{background:var(--strong);color:var(--on-strong);border-color:var(--strong)}
@media (max-width:460px){.crg{gap:7px 5px;padding:6px 2px}.crg .tg{font-size:.92rem}.crg .ph .pts-disc{width:clamp(42px,6.5dvh,54px);height:clamp(42px,6.5dvh,54px);font-size:1rem}}
@media (min-width:900px) and (orientation:landscape){.crg{--cell:clamp(40px,calc((100cqh - 350px) / 7),74px)}.crg .tg{font-size:1.3rem}.crg .k{font-size:.86rem}.crg .ph .pts-disc{width:84px;height:84px;font-size:1.6rem}}

/* Horloge */
.ck{display:flex;flex-direction:column;gap:8px}
.ck-row{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px 14px}
.ck-row.is-cur{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 12%,var(--surface))}
.ck-top{display:flex;align-items:center;gap:8px}
.pc-name{font-weight:700;font-size:.9rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ck-target{margin-left:auto;display:flex;align-items:center;gap:8px}
.ck-target small{font-size:.6rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.1em}
.ck-target b{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--strong);color:var(--on-strong);font-size:1.15rem;font-weight:800;font-variant-numeric:tabular-nums}
.ck-row.is-cur .ck-target b{background:var(--blue);color:var(--on-blue);box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--pc)}
.ck-track{display:grid;grid-template-columns:repeat(var(--len),minmax(0,1fr));gap:3px;margin-top:12px}
.pip{aspect-ratio:1;border-radius:50%;background:var(--surface-2);font-size:.5rem;display:grid;place-items:center;color:var(--muted);font-weight:700;overflow:hidden;max-height:30px;justify-self:center;width:100%;max-width:30px}
.pip.done{background:var(--pc)}
.pip.now{box-shadow:inset 0 0 0 2px var(--pc);color:var(--text);background:var(--surface-3)}
.ck-pad{display:grid;gap:8px;grid-template-columns:repeat(var(--c),minmax(0,1fr));margin-bottom:2px}
.ck-pad .k{min-height:0;height:100%;font-size:1.25rem}
.t-clock .ck-pad{flex:1 1 0;min-height:76px;max-height:190px;grid-template-rows:minmax(0,1fr)}
.ck.n3 .ck-row,.ck.n4 .ck-row{padding:8px 12px 10px}.ck.n3 .ck-top,.ck.n4 .ck-top{min-height:40px}.ck.n3 .ck-target b,.ck.n4 .ck-target b{width:40px;height:40px;font-size:.95rem}.ck.n3 .ck-track,.ck.n4 .ck-track{margin-top:8px}.ck.n4 .pip{max-height:18px}
.ck-pad .k.hit{background:var(--strong);color:var(--on-strong);border-color:var(--strong)}
.ck-pad .k.hit small{color:inherit;opacity:.75}
/* Cible repère : prend la place libre, les boutons gardent une hauteur fixe */
.ck-board{flex:1 1 0;min-height:0;position:relative;container-type:size}
.ck-board svg{display:block;width:100%;height:100%;overflow:visible}
.ck-board .b-s,.ck-board .b-r,.ck-board .b-ob,.ck-board .b-bull{opacity:.22}
.ck-board .b-num{opacity:.5}
.ck-board [data-hl]{opacity:1}
.ck-board .b-s[data-hl],.ck-board .b-ob[data-hl]{fill:var(--accent)}
.ck-board .b-r[data-hl],.ck-board .b-bull[data-hl]{fill:var(--b-s2)}
.ck-board .b-num[data-hl]{fill:var(--accent);font-size:24px}
@container (max-height:130px){.ck-board .dsq{display:none}}
.t-clock .g-pad{container:ckpad/size}
.t-clock .ck-board + .ck-pad{flex:none;height:clamp(76px,12dvh,140px)}
/* Pas la place pour une cible lisible : on la retire et les boutons reprennent la hauteur */
@container ckpad (max-height:310px){.ck-board{display:none}.t-clock .ck-board + .ck-pad{flex:1 1 0;height:auto}}

/* Disposition tablette / PC / téléphone en paysage */
@media (orientation:landscape) and (min-width:700px){
  .g-body.split{flex-direction:row;gap:20px}
  .g-body.split .g-main{flex:0 0 clamp(300px,36vw,560px);justify-content:center}
  .g-body.split .g-pad{flex:1 1 0}
  .g-body.split .players{flex-wrap:wrap;justify-content:center;row-gap:16px}
  .g-body.split .pdisc{--d:clamp(84px,17vh,150px);flex:0 1 46%}
  .g-body.split .pdisc.is-cur{--d:clamp(110px,24vh,210px)}
  .g-body.split .pd-name{font-size:.95rem}.g-body.split .pd-meta{font-size:.74rem}
  .g-body.split .turn{justify-content:center}
  .g-body.split .slot{width:clamp(46px,7vh,64px);height:clamp(46px,7vh,64px);font-size:.82rem}
  .g-body.split .pad .k{min-height:clamp(54px,10vh,92px);font-size:1.4rem}
  .g-body.split .pad .k.mod,.g-body.split .pad .k.act,.g-body.split .pad .k.miss{font-size:1rem}
  .g-body.split .ck-pad .k{font-size:1.7rem}
  .g-body.split .acts .k{min-height:64px}
  .g-body.split.x01-pad .g-pad{justify-content:center}
  .t-clock .g-body.split .g-main{flex:1 1 0}
  .t-clock .g-body.split .g-pad{flex:0 0 clamp(300px,36vw,520px);justify-content:center}
  .t-clock .g-body.split .cr-acts{margin-top:0}
}

/* Stats de la partie en cours : seulement sur les grands écrans, dans la place libre.
   Le panneau prend la hauteur qui reste ; s'il n'y en a pas assez, il ne montre rien
   (requêtes de conteneur), et le graphique n'apparaît que s'il a la place. */
.g-stats{display:none;flex:1 1 0;min-height:0;min-width:0;container:gstats/size}
/* L'espacement avant le panneau est porté par son contenu : un panneau vide ne prend aucune place */
.g-main>.g-stats{margin-top:-10px}
.gs-in{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;padding-top:10px}
.gs-h{margin:0;font-size:.66rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600;line-height:1.2}
.gs-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.gs-kpi{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:9px 14px 10px;min-width:0;line-height:1.25}
.gs-kpi span,.gs-kpi small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs-kpi span{font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.gs-kpi b{display:block;font-size:1.45rem;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.25}
.gs-kpi small{font-size:.72rem;color:var(--muted);font-family:var(--font)}
.gs-kpi.main{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.gs-kpi.main span,.gs-kpi.main small{color:inherit;opacity:.8}
.gs-tbl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 10px}
.gs-tbl table{width:100%;border-collapse:collapse;table-layout:fixed;font-variant-numeric:tabular-nums}
.gs-tbl th,.gs-tbl td{padding:6px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid var(--line);line-height:1.25}
.gs-tbl tr:last-child>*{border-bottom:0}
.gs-tbl col.lbl{width:34%}
.gs-tbl thead th{font-size:.72rem;font-weight:700}
.gs-tbl thead .dot{width:8px;height:8px;margin-right:5px}
.gs-tbl tbody th{text-align:left;font-size:.58rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding-left:4px}
.gs-tbl td{font-weight:700;font-size:.9rem;font-family:var(--fd)}
.gs-tbl .cur{background:color-mix(in srgb,var(--pc) 18%,transparent)}
.gs-chart{flex:1 1 0;min-height:0;container:gchart/size}
.gs-chart-in{height:100%;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px 14px}
.gs-ct{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;white-space:nowrap}
.gs-leg{display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-size:.7rem;color:var(--text-2)}
.gs-leg i{width:16px;border-top:2px dashed var(--accent)}
.gs-plot{flex:1 1 0;min-height:0;position:relative;border-bottom:1.5px solid var(--line)}
.gs-area{position:absolute;inset:18px 0 0}
.gs-bars{height:100%;display:flex;align-items:flex-end;gap:6px}
.gs-grp{flex:1 1 0;min-width:0;max-width:calc(var(--n,1) * 44px);height:100%;display:flex;align-items:flex-end;gap:2px}
.gs-bar{flex:1 1 0;min-width:0;position:relative;height:max(3px,calc(var(--h) * 100%));background:var(--pc);border-radius:6px 6px 0 0}
.gs-bar i{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);padding-bottom:3px;font-style:normal;font-size:.6rem;font-weight:700;color:var(--text-2);white-space:nowrap}
.gs-bar.bust{height:3px;background:var(--danger)}
.gs-bar.bust i{color:var(--danger)}
.gs-bar.none{visibility:hidden}
.gs-sep{flex:none;align-self:stretch;border-left:1.5px dashed var(--line)}
.gs-avg{position:absolute;left:0;right:0;bottom:calc(var(--a) * 100%);border-top:2px dashed var(--accent);pointer-events:none}
.gs-empty{position:absolute;inset:0;display:grid;place-items:center;padding:0 12px;color:var(--muted);font-size:.8rem;font-family:var(--font);text-align:center}
@container gstats (max-width:419px){.gs-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container gstats (min-width:620px) and (min-height:460px){.gs-kpi{padding:12px 18px 13px}.gs-kpi b{font-size:1.9rem}.gs-tbl td{font-size:1.05rem}.gs-tbl tbody th{font-size:.64rem}}
@container gchart (max-height:110px){.gs-chart-in{display:none}}
@container gchart (max-width:479px){.gs-bars.many .gs-bar i:not(.key){display:none}}
/* Pas assez de hauteur : on retire les stats secondaires (l2, puis l3), puis tout */
@container gstats (max-height:206px){.gs-in.solo .l2,.gs-in.solo .l3{display:none}}
@container gstats (max-height:122px){.gs-in.solo{display:none}}
@container gstats (max-width:419px) and (max-height:275px){.gs-in.solo .l2{display:none}}
@container gstats (max-width:419px) and (max-height:206px){.gs-in.solo{display:none}}
@container gstats (max-height:266px){.gs-in.multi .l2{display:none}}
@container gstats (max-height:206px){.gs-in.multi .l3{display:none}}
@container gstats (max-height:175px){.gs-in.multi{display:none}}
@media (min-width:700px) and (min-height:600px){
  .t-cricket .g-stats,.t-clock .g-stats{display:flex}
}
@media (orientation:landscape) and (min-width:700px) and (min-height:600px){
  .g-body.split .g-stats{display:flex}
  /* 301/501 sur la cible : la colonne de gauche prend la place que la cible (carrée) laisse */

<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal-root"></div>
<script>
(() => {
'use strict';

/* =====================================================================
   Utilitaires
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ESC[c]);
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
  : 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const nf1 = new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const isNum = v => v != null && isFinite(v);
const fmt1 = v => isNum(v) ? nf1.format(v) : '–';
const fmtInt = v => isNum(v) ? String(Math.round(v)) : '–';
const fmtPct = v => isNum(v) ? Math.round(v * 100) + ' %' : '–';
const fmtDate = ts => new Date(ts).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
const fmtDateTime = ts => new Date(ts).toLocaleString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
const sum = a => a.reduce((x, y) => x + y, 0);
const mean = a => a.length ? sum(a) / a.length : null;
const plural = (n, w, ws) => `${n} ${n > 1 ? (ws || w + 's') : w}`;
const initials = n => String(n).trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase();
const vibrate = ms => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };
const validColor = c => (Number.isInteger(c) && c >= 0 && c < 8) ? c : 0;

/* =====================================================================
   Stockage (localStorage, propre à chaque appareil)
   ===================================================================== */
const KEY = 'dartscorer.';
let storageOK = true;
try { localStorage.setItem(KEY + 'test', '1'); localStorage.removeItem(KEY + 'test'); } catch (e) { storageOK = false; }
function load(k, def) {
  try { const v = localStorage.getItem(KEY + k); return v ? JSON.parse(v) : def; } catch (e) { return def; }
}
function save(k, v) {
  try {
    if (v == null) localStorage.removeItem(KEY + k);
    else localStorage.setItem(KEY + k, JSON.stringify(v));
  } catch (e) {
    storageOK = false;
    toast('Sauvegarde impossible (stockage plein ou bloqué)', 'bad', 3500);
  }
}
// Essai d'écriture sans effet de bord en cas d'échec (stockage plein)
function trySave(k, v) {
  try { localStorage.setItem(KEY + k, JSON.stringify(v)); return true; } catch (e) { return false; }
}
const db = {
  profiles: load('profiles', []),
  games: load('games', []),
  current: load('current', null),
  settings: Object.assign({ voice: true, theme: 'auto', input: 'board', setup: null }, load('settings', {})),
};
if (!Array.isArray(db.profiles)) db.profiles = [];
if (!Array.isArray(db.games)) db.games = [];
const persist = {
  profiles: () => save('profiles', db.profiles),
  games: () => save('games', db.games),
  current: () => save('current', db.current),
  settings: () => save('settings', db.settings),
};

const profile = id => db.profiles.find(p => p.id === id);
const activeProfiles = () => db.profiles.filter(p => !p.deleted).sort((a, b) => a.name.localeCompare(b.name, 'fr'));
const pname = p => (profile(p.id) || p).name;
const pcolor = p => { const pr = profile(p.id); return validColor(pr ? pr.color : p.color); };
const pc = p => `var(--p${pcolor(p)})`;

/* Photos de profil : petite image JPEG carrée (data URL) rangée dans le profil.
   À l'affichage on passe par une URL blob, plus légère à réinjecter à chaque rendu. */
const validPhoto = s => typeof s === 'string' && s.length < 400000 && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/]+=*$/.test(s);
const photoUrls = new Map();
function photoOf(p) {
  const pr = profile(p.id) || p, d = pr.photo;
  if (typeof d !== 'string' || !d.startsWith('data:image/')) return '';
  let u = photoUrls.get(d);
  if (!u) {
    try {
      const [head, b64] = d.split(','), bin = atob(b64), a = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
      u = URL.createObjectURL(new Blob([a], { type: head.slice(5, head.indexOf(';')) }));
    } catch (e) { u = d; }
    photoUrls.set(d, u);
  }
  return u;
}
function avatar(p, cls = '') {
  const pr = profile(p.id) || p, ph = photoOf(pr);
  return `<span class="avatar ${cls}" style="--pc:var(--p${validColor(pr.color)})">${ph ? `<img src="${esc(ph)}" alt="">` : esc(initials(pr.name))}</span>`;
}
// Petite photo seulement si le joueur en a une (sinon rien : la couleur suffit)
const photoMini = (p, cls = 'xs') => photoOf(p) ? avatar(p, cls) : '';

/* =====================================================================
   Fléchettes : codes "M" (raté), "S20", "D20", "T20", "S25" (25), "D25" (Bull)
   ===================================================================== */
const CODE_RE = /^(?:M|[SDT](?:[1-9]|1\d|20)|[SD]25)$/;
function parseDart(code) {
  if (code === 'M') return { code, s: 0, m: 0, v: 0 };
  const m = { S: 1, D: 2, T: 3 }[code[0]], s = +code.slice(1);
  return { code, s, m, v: s * m };
}
function dartLabel(code) {
  if (code === 'M') return '–';
  const d = parseDart(code);
  if (d.s === 25) return d.m === 2 ? 'Bull' : '25';
  return (d.m === 2 ? 'D' : d.m === 3 ? 'T' : '') + d.s;
}

/* =====================================================================
   Règles des jeux
   ===================================================================== */
const CR_TARGETS = [20, 19, 18, 17, 16, 15, 25];
const clockSeq = o => { const s = []; for (let i = 1; i <= 20; i++) s.push(i); if (o.end === 'bull') s.push(25); return s; };
const finishOK = (d, out) => out === 'single' ? d.m > 0 : out === 'double' ? d.m === 2 : d.m >= 2;
function isOneDartFinish(rem, out) {
  const dbl = (rem >= 2 && rem <= 40 && rem % 2 === 0) || rem === 50;
  const tpl = rem >= 3 && rem <= 60 && rem % 3 === 0;
  if (out === 'double') return dbl;
  if (out === 'master') return dbl || tpl;
  return (rem >= 1 && rem <= 20) || rem === 25 || dbl || tpl;
}

function cricketWinner(S, p, g) {
  const n = g.players.length, mode = g.opts.mode;
  const closedAll = q => CR_TARGETS.every(tg => S.marks[q][tg] >= 3);
  const order = [p];
  for (let i = 0; i < n; i++) if (i !== p) order.push(i);
  for (const q of order) {
    if (!closedAll(q)) continue;
    if (mode === 'nopoints') { if (q === p) return q; continue; }
    const others = S.pts.filter((_, i) => i !== q);
    if (mode === 'standard' && q === p && others.every(v => S.pts[q] >= v)) return q;
    if (mode === 'cutthroat' && others.every(v => S.pts[q] <= v)) return q;
  }
  return -1;
}

const RULES = {
  x01: {
    initLeg: g => ({
      rem: g.players.map(p => p.start || g.opts.start),
      opened: g.players.map(() => g.opts.in !== 'double'),
    }),
    openTurn: (S, t) => { t.startRem = S.rem[t.p]; },
    throw(S, t, d, g) {
      const o = g.opts, p = t.p, r = { pts: 0, legWinner: -1 };
      if (!S.opened[p]) {
        if (d.m !== 2) { r.locked = true; return r; }   // double in : il faut un double pour ouvrir
        S.opened[p] = true;
      }
      const rem = S.rem[p];
      if (o.out !== 'single' && isOneDartFinish(rem, o.out)) r.attempt = true;
      const nr = rem - d.v;
      const valid = nr > 0 ? !(o.out !== 'single' && nr === 1) : (nr === 0 && finishOK(d, o.out));
      if (!valid) {
        if (o.bust) { S.rem[p] = t.startRem; t.bust = true; r.bust = true; r.turnOver = true; }
        else r.ignored = true;   // sans bust : la fléchette qui fait dépasser ne compte pas
        return r;
      }
      S.rem[p] = nr; r.pts = d.v;
      if (nr === 0) r.legWinner = p;
      return r;
    },
    closeTurn: (S, t) => { t.pts = t.bust ? 0 : sum(t.results.map(r => r.pts)); t.endRem = S.rem[t.p]; },
  },
  cricket: {
    initLeg: g => ({
      marks: g.players.map(() => ({ 15: 0, 16: 0, 17: 0, 18: 0, 19: 0, 20: 0, 25: 0 })),
      pts: g.players.map(() => 0),
    }),
    openTurn: () => {},
    throw(S, t, d, g) {
      const p = t.p, n = g.players.length, mode = g.opts.mode, r = { marks: 0, pts: 0, legWinner: -1 };
      if (d.m > 0 && CR_TARGETS.includes(d.s)) {
        const before = S.marks[p][d.s];
        const extra = Math.max(0, before + d.m - 3) - Math.max(0, before - 3);
        S.marks[p][d.s] = before + d.m;
        r.marks = d.m;
        if (extra > 0 && mode !== 'nopoints') {
          const open = [];
          for (let q = 0; q < n; q++) if (q !== p && S.marks[q][d.s] < 3) open.push(q);
          if (open.length) {
            const val = d.s * extra;
            if (mode === 'standard') { S.pts[p] += val; r.pts = val; }
            else { open.forEach(q => { S.pts[q] += val; }); r.pts = val; r.given = open; }
          }
        }
      }
      r.legWinner = cricketWinner(S, p, g);
      return r;
    },
    closeTurn: (S, t) => { t.marks = sum(t.results.map(r => r.marks)); },
  },
  clock: {
    initLeg: g => ({ pos: g.players.map(() => 0) }),
    openTurn: () => {},
    throw(S, t, d, g) {
      const o = g.opts, seq = clockSeq(o), p = t.p, target = seq[S.pos[p]];
      const r = { hit: false, legWinner: -1, target };
      if (d.m === 0 || d.s !== target) return r;
      const valid = target === 25 ? (o.zone === 'double' ? d.m === 2 : true)
        : o.zone === 'double' ? d.m === 2 : o.zone === 'triple' ? d.m === 3 : true;
      if (!valid) return r;
      r.hit = true;
      const adv = (o.jumps && o.zone === 'all' && target !== 25) ? d.m : 1;
      let np = S.pos[p] + adv;
      if (o.end === 'bull' && target !== 25) np = Math.min(np, seq.length - 1);
      S.pos[p] = Math.min(np, seq.length);
      if (S.pos[p] >= seq.length) r.legWinner = p;
      return r;
    },
    closeTurn: (S, t) => { t.hits = t.results.filter(r => r.hit).length; },
  },
};

/* Rejoue toutes les fléchettes d'une partie pour obtenir son état.
   Avantage : "annuler" = retirer la dernière fléchette, sans risque d'incohérence. */
function replay(g) {
  const rules = RULES[g.type], n = g.players.length, target = g.opts.legs || 1;
  const st = { legs: [], legsWon: Array(n).fill(0), finished: false, winner: -1, last: null };
  const newTurn = (L, p) => { const t = { p, darts: [], results: [] }; rules.openTurn(L.state, t, g); return t; };
  const newLeg = starter => {
    const L = { starter, turns: [], winner: -1, state: rules.initLeg(g) };
    L.turn = newTurn(L, starter);
    st.legs.push(L);
    return L;
  };
  let L = newLeg(0);
  g.darts.forEach((code, i) => {
    if (st.finished) return;
    const t = L.turn, r = rules.throw(L.state, t, parseDart(code), g);
    t.darts.push(code); t.results.push(r);
    const ev = { turn: null, legWinner: -1, leg: L };
    if (r.legWinner >= 0) {
      rules.closeTurn(L.state, t, g); L.turns.push(t); ev.turn = t; ev.legWinner = r.legWinner;
      L.winner = r.legWinner; st.legsWon[r.legWinner]++;
      if (st.legsWon[r.legWinner] >= target) { st.finished = true; st.winner = r.legWinner; L.turn = null; }
      else L = newLeg((L.starter + 1) % n);
    } else if (r.turnOver || t.darts.length >= 3) {
      rules.closeTurn(L.state, t, g); L.turns.push(t); ev.turn = t;
      L.turn = newTurn(L, (t.p + 1) % n);
    }
    if (i === g.darts.length - 1) st.last = ev;
  });
  st.leg = L;
  return st;
}

/* =====================================================================
   Suggestion de finish (301/501)
   ===================================================================== */
const ALL_DARTS = (() => {
  const a = [];
  for (let s = 20; s >= 1; s--) for (const m of ['T', 'S', 'D']) a.push(parseDart(m + s));
  a.push(parseDart('S25'), parseDart('D25'));
  return a;
})();
const DOUBLE_PREF = [20, 16, 8, 18, 12, 10, 4, 14, 6, 2, 25, 19, 17, 15, 13, 11, 9, 7, 5, 3, 1];
function finCost(d, out) {
  if (out === 'single') return (d.m === 1 ? 0 : d.m === 2 ? 3 : 5) + (d.s === 25 ? 2 : 0);
  if (d.m === 2) return DOUBLE_PREF.indexOf(d.s);
  return 25 + (20 - d.s);
}
function setupCost(d) {
  if (d.m === 3) return d.s === 20 ? 0 : d.s === 19 ? 0.5 : d.s === 18 ? 1 : d.s === 17 ? 1.5 : 3;
  if (d.m === 1) return d.s === 25 ? 2.5 : 1;
  return d.s === 25 ? 4 : 5;
}
const coCache = new Map();
function checkout(rem, darts, out) {
  if (rem < 1 || rem > 180 || darts < 1) return null;
  const key = rem + '|' + darts + '|' + out;
  if (coCache.has(key)) return coCache.get(key);
  const bestFin = {};
  ALL_DARTS.filter(d => finishOK(d, out)).forEach(d => {
    const c = finCost(d, out);
    if (!bestFin[d.v] || c < bestFin[d.v].c) bestFin[d.v] = { d, c };
  });
  const minLeft = out === 'single' ? 1 : 2;
  let best = null;
  const consider = (route, cost) => { if (!best || cost < best.cost) best = { route, cost }; };
  if (bestFin[rem]) consider([bestFin[rem].d], bestFin[rem].c);
  if (!best && darts >= 2) {
    for (const a of ALL_DARTS) {
      const r1 = rem - a.v;
      if (r1 >= minLeft && bestFin[r1]) consider([a, bestFin[r1].d], setupCost(a) + bestFin[r1].c);
    }
  }
  if (!best && darts >= 3) {
    for (const a of ALL_DARTS) {
      const r1 = rem - a.v;
      if (r1 < minLeft) continue;
      for (const b of ALL_DARTS) {
        const r2 = r1 - b.v;
        if (r2 >= minLeft && bestFin[r2]) consider([a, b, bestFin[r2].d], setupCost(a) + setupCost(b) + bestFin[r2].c);
      }
    }
  }
  if (best && best.route.length === 3) {
    // Ordre naturel : la fléchette la plus "facile / rentable" d'abord (T20 avant T19, triple avant simple)
    const [a, b, f] = best.route;
    best.route = (setupCost(b) < setupCost(a) || (setupCost(b) === setupCost(a) && b.v > a.v)) ? [b, a, f] : [a, b, f];
  }
  const res = best ? best.route.map(d => d.code) : null;
  coCache.set(key, res);
  return res;
}

   Statistiques
   ===================================================================== */
function matchStats(g) {
  const st = replay(g), n = g.players.length;
  const P = g.players.map(() => ({
    darts: 0, pts: 0, turns: 0, best: 0, c100: 0, c140: 0, c180: 0, bestFinish: 0,
    att: 0, hit: 0, marks: 0, hits: 0, finishDarts: [], legsWon: 0,
  }));
  st.legs.forEach(L => {
    const legDarts = Array(n).fill(0);
    L.turns.forEach(t => {
      const s = P[t.p];
      const nd = (g.type === 'x01' && t.bust) ? 3 : t.darts.length;
      s.darts += nd; s.turns++; legDarts[t.p] += nd;
      if (g.type === 'x01') {
        s.pts += t.pts; s.best = Math.max(s.best, t.pts);
        if (t.pts === 180) s.c180++; else if (t.pts >= 140) s.c140++; else if (t.pts >= 100) s.c100++;
        t.results.forEach(r => {
          if (r.attempt) s.att++;
          if (r.legWinner === t.p) { s.hit++; s.bestFinish = Math.max(s.bestFinish, t.startRem); }
        });
      } else if (g.type === 'cricket') s.marks += t.marks;
      else s.hits += t.hits;
    });
    if (L.winner >= 0) {
      P[L.winner].legsWon++;
      if (g.type === 'clock') P[L.winner].finishDarts.push(legDarts[L.winner]);
    }
  });
  P.forEach(s => {
    s.avg = s.darts ? s.pts / s.darts * 3 : null;
    s.mpr = s.darts ? s.marks / s.darts * 3 : null;
    s.hitRate = s.darts ? s.hits / s.darts : null;
    s.finishPct = s.att ? s.hit / s.att : null;
    s.bestClock = s.finishDarts.length ? Math.min(...s.finishDarts) : null;
    s.avgClock = mean(s.finishDarts);
  });
  return { st, P };
}
const statCache = new Map();
function cachedStats(g) {
  let s = statCache.get(g.id);
  if (!s) { s = matchStats(g); statCache.set(g.id, s); }
  return s;
}
function liveStats(g, st) {
  const P = g.players.map(() => ({ darts: 0, pts: 0, marks: 0, hits: 0, last: null }));
  st.legs.forEach(L => L.turns.forEach(t => {
    const s = P[t.p];
    if (g.type === 'x01') { s.darts += t.bust ? 3 : t.darts.length; s.pts += t.pts; if (L === st.leg) s.last = t.bust ? 'Bust' : t.pts; }
    else if (g.type === 'cricket') { s.darts += t.darts.length; s.marks += t.marks; if (L === st.leg) s.last = t.marks; }
    else { s.darts += t.darts.length; s.hits += t.hits; if (L === st.leg) s.last = t.hits; }
  }));
  P.forEach(s => { s.avg = s.darts ? s.pts / s.darts * 3 : null; s.mpr = s.darts ? s.marks / s.darts * 3 : null; });
  return P;
}
function profileStats(pid) {
  const games = db.games.filter(g => g.players.some(p => p.id === pid)).sort((a, b) => a.finishedAt - b.finishedAt);
  const A = {
    games: games.length,
    x01: { n: 0, darts: 0, pts: 0, best: 0, c100: 0, c140: 0, c180: 0, bestFinish: 0, att: 0, hit: 0, bestAvg: null, series: [] },
    cricket: { n: 0, darts: 0, marks: 0, bestMpr: null, series: [] },
    clock: { n: 0, darts: 0, hits: 0, finishes: [], series: [] },
    wins: { x01: [0, 0], cricket: [0, 0], clock: [0, 0] },
    h2h: new Map(),
    recent: games.slice(-8).reverse(),
  };
  for (const g of games) {
    let P;
    try { P = cachedStats(g).P; } catch (e) { continue; }
    const i = g.players.findIndex(p => p.id === pid), s = P[i];
    if (g.type === 'x01') {
      const a = A.x01; a.n++; a.darts += s.darts; a.pts += s.pts; a.best = Math.max(a.best, s.best);
      a.c100 += s.c100; a.c140 += s.c140; a.c180 += s.c180; a.bestFinish = Math.max(a.bestFinish, s.bestFinish);
      a.att += s.att; a.hit += s.hit;
      if (s.avg != null) { a.bestAvg = Math.max(a.bestAvg ?? 0, s.avg); a.series.push({ t: g.finishedAt, y: s.avg }); }
    } else if (g.type === 'cricket') {
      const a = A.cricket; a.n++; a.darts += s.darts; a.marks += s.marks;
      if (s.mpr != null) { a.bestMpr = Math.max(a.bestMpr ?? 0, s.mpr); a.series.push({ t: g.finishedAt, y: s.mpr }); }
    } else {
      const a = A.clock; a.n++; a.darts += s.darts; a.hits += s.hits; a.finishes.push(...s.finishDarts);
      if (s.avgClock != null) a.series.push({ t: g.finishedAt, y: s.avgClock });
    }
    if (g.players.length > 1) {
      const w = A.wins[g.type]; w[0]++; if (g.winner === i) w[1]++;
      g.players.forEach((q, j) => {
        if (j === i) return;
        const h = A.h2h.get(q.id) || { player: q, n: 0, w: 0, l: 0 };
        h.n++; if (g.winner === i) h.w++; else if (g.winner === j) h.l++;
        A.h2h.set(q.id, h);
      });
    }
  }
  A.x01.avg = A.x01.darts ? A.x01.pts / A.x01.darts * 3 : null;
  A.x01.finishPct = A.x01.att ? A.x01.hit / A.x01.att : null;
  A.cricket.mpr = A.cricket.darts ? A.cricket.marks / A.cricket.darts * 3 : null;
  A.clock.hitRate = A.clock.darts ? A.clock.hits / A.clock.darts : null;
  A.clock.best = A.clock.finishes.length ? Math.min(...A.clock.finishes) : null;
  A.clock.avgF = mean(A.clock.finishes);
  A.played = sum(Object.values(A.wins).map(w => w[0]));
  A.won = sum(Object.values(A.wins).map(w => w[1]));
  A.winPct = A.played ? A.won / A.played : null;
  return A;
}

/* Voix : les voix "Natural / Online" (Edge, Android) passent par internet.
   Hors ligne, ou si elles échouent, on bascule sur une voix installée sur l'appareil. */
const voice = {
  pick(localOnly) {
    try {
      let fr = speechSynthesis.getVoices().filter(v => /^fr/i.test(v.lang));
      if (localOnly && fr.some(v => v.localService)) fr = fr.filter(v => v.localService);
      const score = v => (/fr[-_]FR/i.test(v.lang) ? 4 : 0) + (!localOnly && /natural|neural/i.test(v.name) ? 2 : 0) + (v.localService ? 1 : 0);
      return fr.sort((a, b) => score(b) - score(a))[0] || null;
    } catch (e) { return null; }
  },
  say(text, force) {
    if ((!db.settings.voice && !force) || !('speechSynthesis' in window)) return;
    const speak = localOnly => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'fr-FR';
      u.rate = 1.05;
      const v = this.pick(localOnly);
      if (v) u.voice = v;
      if (!localOnly && v && !v.localService) {
        u.onerror = e => { if (e.error !== 'interrupted' && e.error !== 'canceled') speak(true); };
      }
      speechSynthesis.speak(u);
    };
    try { speechSynthesis.cancel(); speak(navigator.onLine === false); } catch (e) {}
  },
};
if ('speechSynthesis' in window) {
  try {
    speechSynthesis.getVoices();   // la liste arrive de façon asynchrone : on rafraîchit l'écran Réglages quand elle est prête
    speechSynthesis.onvoiceschanged = () => { if (route().view === 'settings') render(); };
  } catch (e) {}
}

      wakeLock.addEventListener('release', () => { wakeLock = null; });

const PHOTO_PX = 192;
function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Image illisible')); };
    img.src = url;
  });
}
// Recadre au carré et réduit à PHOTO_PX (≈ 15-25 Ko en JPEG) pour ménager le stockage du navigateur.
async function photoFromFile(file) {
  const img = await loadImage(file);   // le navigateur applique l'orientation EXIF de la photo
  const w = img.naturalWidth, h = img.naturalHeight, s = Math.min(w, h);
  if (!s) throw new Error('Image vide');
  // Photo en hauteur : on cadre un peu au-dessus du centre, là où se trouve d'habitude le visage
  let src = img, x = (w - s) / 2, y = h > w ? (h - s) * 0.4 : (h - s) / 2, size = s;
  while (size / 2 >= PHOTO_PX) {   // réduction par paliers : plus net qu'un seul grand saut
    const half = Math.round(size / 2), c = document.createElement('canvas');
    c.width = c.height = half;
    c.getContext('2d').drawImage(src, x, y, size, size, 0, 0, half, half);
    src = c; x = 0; y = 0; size = half;
  }
  const out = document.createElement('canvas');
  out.width = out.height = PHOTO_PX;
  const ctx = out.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, PHOTO_PX, PHOTO_PX);
  ctx.drawImage(src, x, y, size, size, 0, 0, PHOTO_PX, PHOTO_PX);
  return out.toDataURL('image/jpeg', 0.82);
}

    if (token !== app.photoToken) return;   // fenêtre fermée ou changée entre-temps
    app.modalPhoto = data;
    if (err) err.hidden = true;
  } catch (e) {
    if (token === app.photoToken && err) { err.textContent = 'Impossible de lire cette image. Essaie une autre photo.'; err.hidden = false; }
  } finally {
    if (prev) prev.classList.remove('busy');
    if (token === app.photoToken) refreshPhotoPreview();
  }
}

const icon = (name, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[name]}</svg>`;

/* ---------- Cible : géométrie commune à la saisie et au logo ----------
   Rayons en unités du viewBox (centre 0,0). Les anneaux double et triple sont
   volontairement plus larges que sur une vraie cible, pour viser au doigt. */
const BOARD_ORDER = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
const BR = { rim: 200, dO: 177, dI: 151, tO: 108, tI: 81, ob: 39, b: 18.5, num: 188.5 };
const BOARD_VIEW = '-206 -206 412 412';
const f2 = v => v.toFixed(2);
const bpt = (r, a) => [r * Math.sin(a), -r * Math.cos(a)];
function wedge(r1, r2, a1, a2) {
  const [x1, y1] = bpt(r2, a1), [x2, y2] = bpt(r2, a2), [x3, y3] = bpt(r1, a2), [x4, y4] = bpt(r1, a1);
  return `M${f2(x1)} ${f2(y1)}A${r2} ${r2} 0 0 1 ${f2(x2)} ${f2(y2)}L${f2(x3)} ${f2(y3)}A${r1} ${r1} 0 0 0 ${f2(x4)} ${f2(y4)}Z`;
}
// Segments de la cible ; « live » ajoute les codes de fléchette pour la saisie au toucher.
// nums : affiche les numéros ; hl : codes des zones à mettre en avant (ex. Set ['S3', 'D3', 'T3'])
function boardShapes(live, { nums = live, hl = null } = {}) {
  const at = code => (live ? ` data-action="dart" data-code="${code}"` : '') + (hl && hl.has(code) ? ' data-hl' : '');
  const out = [`<circle class="b-rim" r="${BR.rim}"/>`];
  for (let i = 0; i < 20; i++) {
    const n = BOARD_ORDER[i], a1 = (i - 0.5) * Math.PI / 10, a2 = (i + 0.5) * Math.PI / 10, c = i % 2 ? 'l' : 'd';
    out.push(`<path class="b-s ${c}" d="${wedge(BR.ob, BR.tI, a1, a2)}"${at('S' + n)}/>`,
      `<path class="b-r ${c}" d="${wedge(BR.tI, BR.tO, a1, a2)}"${at('T' + n)}/>`,
      `<path class="b-s ${c}" d="${wedge(BR.tO, BR.dI, a1, a2)}"${at('S' + n)}/>`,
      `<path class="b-r ${c}" d="${wedge(BR.dI, BR.dO, a1, a2)}"${at('D' + n)}/>`);
  }
  out.push(`<circle class="b-ob" r="${BR.ob}"${at('S25')}/><circle class="b-bull" r="${BR.b}"${at('D25')}/>`);
  if (nums) BOARD_ORDER.forEach((n, i) => {
    const [x, y] = bpt(BR.num, i * Math.PI / 10), on = hl && (hl.has('S' + n) || hl.has('D' + n) || hl.has('T' + n));
    out.push(`<text class="b-num"${on ? ' data-hl' : ''} x="${f2(x)}" y="${f2(y)}">${n}</text>`);
  });
  return out.join('');
}
const BOARD_LIVE = boardShapes(true);
// Grande cible de l'accueil (décor, avec les numéros)
const HOME_BOARD = `<svg class="bsvg" viewBox="${BOARD_VIEW}" aria-hidden="true">${boardShapes(false, { nums: true })}</svg>`;
// Centre de la zone touchée par une fléchette (k décale un peu les fléchettes d'une même volée)
function dartSpot(code, k = 1) {
  const d = parseDart(code);
  if (!d.m) return null;
  if (d.s === 25) return d.m === 2 ? [(k - 1) * 7, 0] : bpt((BR.b + BR.ob) / 2, (k - 1) * 0.6);
  const i = BOARD_ORDER.indexOf(d.s), a = i * Math.PI / 10 + (k - 1) * 0.06;
  return bpt(d.m === 2 ? (BR.dI + BR.dO) / 2 : d.m === 3 ? (BR.tI + BR.tO) / 2 : (BR.tO + BR.dI) / 2, a);
}

// Marques du Cricket : anneau en trois arcs, plein quand le numéro est fermé
function markSvg(n) {
  const label = `role="img" aria-label="${n >= 3 ? 'fermé' : n + ' marque' + (n > 1 ? 's' : '')}"`;
  if (n >= 3) return `<svg viewBox="0 0 32 32" ${label}><circle cx="16" cy="16" r="15.5" class="mk-on"/><circle cx="16" cy="16" r="4.5" class="mk-hole"/></svg>`;
  const C = 2 * Math.PI * 13, dash = C / 3 - 3, rot = 'transform="rotate(-90 16 16)"';
  const arc = n === 1 ? `${f2(dash)} ${f2(C - dash)}` : `${f2(dash)} 3 ${f2(dash)} ${f2(C - 2 * dash - 3)}`;
  return `<svg viewBox="0 0 32 32" ${label}><circle cx="16" cy="16" r="13" class="mk-track" stroke-dasharray="${f2(dash)} 3" ${rot}/>${n > 0 ? `<circle cx="16" cy="16" r="13" class="mk-arc" stroke-dasharray="${arc}" ${rot}/>` : ''}</svg>`;
}

const DEFAULT_OPTS = { start: 501, in: 'single', out: 'double', bust: true, handicap: false, legs: 1, mode: 'standard', zone: 'all', jumps: false, end: '20' };
const HCP_STARTS = [101, 201, 301, 401, 501, 601, 701];
const OPTS = {
  x01: [
    { key: 'in', label: 'Entrée', vals: [['single', 'Simple'], ['double', 'Double']], hint: { double: 'Il faut toucher un double pour commencer à marquer.' } },

      hint: { single: 'N\'importe quelle fléchette peut finir.', double: 'Il faut finir sur un double (le Bull compte comme double).', master: 'Il faut finir sur un double ou un triple.' } },
    { key: 'bust', label: 'Dépassement', vals: [[true, 'Bust'], [false, 'Sans bust']],
      hint: { true: 'Si on dépasse, toute la volée est annulée.', false: 'La fléchette qui fait dépasser est ignorée, on continue.' } },
    { key: 'handicap', label: 'Handicap', vals: [[false, 'Non'], [true, 'Score par joueur']], hint: { true: 'Le score de départ se choisit à côté de chaque joueur.' } },
  ],
  cricket: [
    { key: 'mode', label: 'Mode', vals: [['standard', 'Standard'], ['cutthroat', 'Cut-throat'], ['nopoints', 'Sans points']],
      hint: { standard: 'Les points sont pour toi. Ferme tout en ayant le plus de points.', cutthroat: 'Les points vont aux adversaires. Ferme tout en ayant le moins de points.', nopoints: 'Le premier qui ferme tout gagne.' } },
  ],
  clock: [
    { key: 'zone', label: 'Zone valide', vals: [['all', 'Tout le numéro'], ['double', 'Doubles'], ['triple', 'Triples']] },
    { key: 'jumps', label: 'Sauts', vals: [[false, 'Non'], [true, 'D = +2, T = +3']], when: o => o.zone === 'all', hint: { true: 'Un double fait avancer de 2 cases, un triple de 3.' } },
    { key: 'end', label: 'Arrivée', vals: [['20', 'Au 20'], ['bull', 'Au Bull']] },
  ],
};
function parseOpt(key, v) {
  if (v === 'true') return true;
  if (v === 'false') return false;
  if (key === 'legs' || key === 'start') return +v;
  return v;
}
function normOpts(type, o) {
  o = o || {};
  const pick = (k, allowed) => allowed.includes(o[k]) ? o[k] : DEFAULT_OPTS[k];
  const legs = Number.isInteger(o.legs) && o.legs >= 1 && o.legs <= 9 ? o.legs : 1;
  if (type === 'x01') return {
    start: Number.isInteger(o.start) && o.start > 1 && o.start <= 1001 ? o.start : 501,
    in: pick('in', ['single', 'double']), out: pick('out', ['single', 'double', 'master']),
    bust: typeof o.bust === 'boolean' ? o.bust : true, handicap: !!o.handicap, legs,
  };
  if (type === 'cricket') return { mode: pick('mode', ['standard', 'cutthroat', 'nopoints']), legs };
  return { zone: pick('zone', ['all', 'double', 'triple']), jumps: !!o.jumps, end: pick('end', ['20', 'bull']), legs };
}
function gameTitle(g) {
  if (g.type === 'x01') return g.opts.handicap && g.players.some(p => p.start && p.start !== g.opts.start) ? `${g.opts.start} (handicap)` : String(g.opts.start);
  return g.type === 'cricket' ? 'Cricket' : 'Horloge';
}
function gameSub(g) {
  const o = g.opts, a = [];
  if (g.type === 'x01') {
    if (o.in === 'double') a.push('Double in');
    a.push(o.out === 'double' ? 'Double out' : o.out === 'master' ? 'Master out' : 'Sortie simple');
    a.push(o.bust ? 'Bust' : 'Sans bust');
  } else if (g.type === 'cricket') {
    a.push({ standard: 'Standard', cutthroat: 'Cut-throat', nopoints: 'Sans points' }[o.mode]);
  } else {
    a.push({ all: 'Tout le numéro', double: 'Doubles', triple: 'Triples' }[o.zone]);
    if (o.jumps && o.zone === 'all') a.push('Sauts');
    a.push(o.end === 'bull' ? 'Jusqu\'au Bull' : 'Jusqu\'au 20');
  }
  if ((o.legs || 1) > 1) a.push(`Premier à ${o.legs} manches`);
  return a.join(' · ');
}

/* =====================================================================
   Navigation
   ===================================================================== */
function route() {
  const [view, id] = location.hash.replace(/^#\/?/, '').split('/');
  return { view: view || 'home', id: id ? decodeURIComponent(id) : '' };
}
function go(path) {
  const h = '#/' + path;
  if (location.hash === h) render(); else location.hash = h;
}
function topbar(title, right = '', back = '') {
  return `<header class="topbar"><button class="icon-btn" data-action="back" data-to="${back}" aria-label="Retour">${icon('back')}</button><h1>${title}</h1>${right}</header>`;
}

function render() {
  const r = route();
  let html;
  try {
    switch (r.view) {
      case 'setup': html = viewSetup(); break;
      case 'game':
        if (!db.current) { location.replace('#/'); return; }
        html = viewGame(); break;
      case 'players': html = viewPlayers(); break;
      case 'player': html = viewProfile(r.id); break;
      case 'admin': html = viewAdmin(); break;
      case 'history': html = r.id ? viewGameDetail(r.id) : viewHistory(); break;
      case 'settings': html = viewSettings(); break;
      default: html = viewHome();
    }
  } catch (e) {
    console.error(e);
    html = `<main class="page"><div class="card"><h3>Oups, un problème d'affichage</h3><p class="muted">${esc(e.message)}</p>
      <div class="row-btns"><button class="btn primary" data-action="go" data-to="">Accueil</button>
      ${r.view === 'game' ? '<button class="btn danger" data-action="abandon-game">Abandonner la partie</button>' : ''}</div></div></main>`;
  }
  // Un écran qui défile dans sa propre hauteur garde sa position quand on le redessine
  const prev = document.body.dataset.view === r.view && $('#app .page.fit'), top = prev ? prev.scrollTop : 0;
  $('#app').innerHTML = html;
  if (top) { const sc = $('#app .page.fit'); if (sc) sc.scrollTop = top; }
  document.body.dataset.view = r.view;
  if (r.view === 'admin') filterAdmin();
  keepAwake(r.view === 'game' && !!db.current && !db.current.finishedAt);
  enhanceCharts();
}

function setupState() {
  let s = db.settings.setup;
  if (!s || typeof s !== 'object') s = db.settings.setup = { type: 'x01', players: [], opts: {}, hcp: {} };
  if (!RULES[s.type]) s.type = 'x01';
  s.opts = Object.assign({}, DEFAULT_OPTS, s.opts);
  s.hcp = s.hcp || {};
  s.players = (s.players || []).filter(id => { const p = profile(id); return p && !p.deleted; }).slice(0, 4);
  return s;
}
function segRow(d, val) {
  const hint = d.hint && d.hint[String(val)];
  return `<div class="opt-row"><div class="opt-lbl">${d.label}</div><div class="seg" role="group" aria-label="${esc(d.label)}">${d.vals.map(([v, l]) =>
    `<button class="${String(v) === String(val) ? 'on' : ''}${d.num ? ' num' : ''}" aria-pressed="${String(v) === String(val)}" data-action="setup-opt" data-key="${d.key}" data-val="${v}">${l}</button>`).join('')}</div>
    ${hint ? `<div class="hint">${hint}</div>` : ''}</div>`;
}
const LEGS_OPT = { key: 'legs', label: 'Manches à gagner', num: true, vals: [1, 2, 3, 4, 5].map(v => [v, String(v)]), hint: { 2: 'On tourne à chaque manche.', 3: 'On tourne à chaque manche.', 4: 'On tourne à chaque manche.', 5: 'On tourne à chaque manche.' } };
// Règles du jeu choisi, réglables directement sur l'écran
function rulesRows(s) {
  const o = s.opts;
  return OPTS[s.type].filter(d => !d.when || d.when(o)).map(d => segRow(d, o[d.key])).join('') + segRow(LEGS_OPT, o.legs);
}

function startGame() {

function turnPanel(g, st) {

  const p = g.players[t.p];

    const c = t.darts[i];

    const r = t.results[i];
    return `<span class="slot on ${(r.ignored || r.locked) ? 'void' : ''}">${dartLabel(c)}</span>`;
  }).join('');
  let total = '', right = `<div class="turn-who"><small>${g.players.length > 1 ? 'À toi' : 'Volée'}</small>${esc(pname(p))}</div>`;
  if (g.type === 'x01') {

/* ---------- Stats de la partie en cours (grands écrans) ----------

// Graphique des volées : une barre par volée (un groupe par tour à plusieurs), les plus récentes
function statsChart(g, P, vols) {

    const grp = last && last.leg === v.leg && last.round === v.round ? last : { leg: v.leg, round: v.round, num: groups.length + 1, v: Array(n).fill(null) };
    if (grp !== last) groups.push(grp);

  });
  const shown = groups.slice(-Math.max(6, Math.floor(24 / n)));
  const vals = shown.flatMap(gr => gr.v.filter(v => v && !v.bust).map(v => v.v));
  const top = T === 'clock' ? 3 : Math.max(T === 'x01' ? 60 : 3, ...vals), best = Math.max(0, ...vals);
  let bars = '', prevLeg = shown.length ? shown[0].leg : 0;
  shown.forEach((gr, gi) => {
    if (gr.leg !== prevLeg) { bars += '<span class="gs-sep" aria-hidden="true"></span>'; prevLeg = gr.leg; }
    bars += `<span class="gs-grp">${gr.v.map(v => {
      if (!v) return n > 1 ? '<span class="gs-bar none"></span>' : '';
      const p = g.players[v.p], lbl = v.bust ? 'Bust' : v.v;
      const tip = `${n > 1 ? `Tour ${gr.num} · ${pname(p)}` : `Volée ${v.num}`} : ${v.bust ? 'bust' : `${v.v} ${unit}`}`;
      // Valeur au-dessus de la barre : toutes s'il y a peu de volées, sinon la dernière et la meilleure (key)
      const key = gi === shown.length - 1 || (!v.bust && v.v === best && best > 0);
      const lblHtml = n > 1 || (!key && shown.length > 14) ? '' : `<i${key ? ' class="key"' : ''}>${lbl}</i>`;
      return `<span class="gs-bar${v.bust ? ' bust' : ''}" style="--h:${(v.bust ? 0 : v.v / top).toFixed(3)};--pc:${pc(p)}" title="${esc(tip)}">${lblHtml}</span>`;
    }).join('')}</span>`;
  });

  const ttl = `${unit[0].toUpperCase() + unit.slice(1)} par volée`;
  return `<div class="gs-chart"><div class="gs-chart-in" role="img" aria-label="${ttl}, ${plural(vols.length, 'volée')}">
    <div class="gs-ct"><span>${ttl}</span>${avg != null ? `<span class="gs-leg"><i></i>moy. ${fmt1(avg)}</span>` : ''}</div>
    <div class="gs-plot"><div class="gs-area">${vols.length ? `${avg != null ? `<div class="gs-avg" style="--a:${Math.min(1, avg / top).toFixed(3)}"></div>` : ''}<div class="gs-bars${shown.length > 8 ? ' many' : ''}" style="--n:${n}">${bars}</div>`
      : '<div class="gs-empty">Le graphique se remplit à chaque volée.</div>'}</div></div>
  </div></div>`;
}

      : `En ${plural(s.darts, 'fléchette')} · ${fmtPct(s.hitRate)} de réussite`;
  }
  return `<div class="end" role="dialog" aria-modal="true" aria-label="Fin de partie"><div class="card end-card">
    <div class="end-top">${hero && photoOf(hero) ? avatar(hero, 'xl win') : icon('trophy')}<h2>${multi ? `${esc(pname(w))} gagne !` : 'Partie terminée !'}</h2><p class="muted" style="margin:0">${sub}</p></div>
    ${statsTable(g, P, st.winner)}
    <div class="end-actions">
      <button class="btn primary big" data-action="rematch">Revanche</button>
      <button class="btn big" data-action="end-new">Nouvelle partie</button>
      <button class="btn big" data-action="end-home">Accueil</button>
    </div>
    <button class="btn ghost block" data-action="undo">${icon('undo')} Erreur de saisie ? Annuler la dernière fléchette</button>
  </div></div>`;
}

/* ---------- Saisie ---------- */
function pushDarts(codes) {
  const g = db.current;
  if (!g || g.finishedAt) return;
  let st = null;
  for (const c of codes) {
    g.darts.push(c);
    st = replay(g);
    if (st.finished) break;
  }
  app.mod = 0;
  if (st.finished) finishGame(g, st);
  persist.current();
  vibrate(12);
  announce(g, st);
  render();
}
function finishGame(g, st) {
  g.finishedAt = Date.now();
  g.winner = st.winner;
  db.games = db.games.filter(x => x.id !== g.id);
  db.games.push(JSON.parse(JSON.stringify(g)));
  statCache.delete(g.id);
  persist.games();
}
function undo() {
  const g = db.current;
  if (!g || !g.darts.length) return;
  if (g.finishedAt) {
    delete g.finishedAt; delete g.winner;
    db.games = db.games.filter(x => x.id !== g.id);
    statCache.delete(g.id);
    persist.games();
  }
  g.darts.pop();
  app.mod = 0;
  persist.current();
  vibrate(8);
  render();
}
function announce(g, st) {
  const ev = st.last;
  if (!ev) return;
  if (st.finished) {
    const w = pname(g.players[st.winner]);
    voice.say(g.players.length > 1 ? `Victoire de ${w} !` : 'Partie terminée, bravo !');
    return;
  }
  const next = st.leg.turn ? g.players[st.leg.turn.p] : null, multi = g.players.length > 1;
  if (ev.legWinner >= 0) {
    const w = pname(g.players[ev.legWinner]);
    toast(`Manche pour ${w} !`, 'gold', 2200);
    voice.say(`Manche pour ${w}.${next && multi ? ` ${pname(next)} commence.` : ''}`);
    return;
  }
  const t = ev.turn;
  if (!t) return;
  const who = pname(g.players[t.p]);
  if (g.type === 'x01') {
    if (t.bust) { toast(`${who} : Bust !`, 'bad'); voice.say('Bust !'); return; }
    toast(`${who} : ${t.pts}`, t.pts === 180 ? 'gold' : t.pts >= 100 ? 'good' : '', t.pts === 180 ? 2200 : 1500);
    let txt = t.pts === 180 ? 'Cent quatre-vingts !' : String(t.pts);
    if (next) {
      const S = st.leg.state, i = st.leg.turn.p, rem = S.rem[i];
      if (S.opened[i] && rem <= 170 && checkout(rem, 3, g.opts.out)) txt += `. ${multi ? pname(next) + ', il' : 'Il'} te reste ${rem}.`;
    }
    voice.say(txt);
  } else if (g.type === 'cricket') {
    toast(`${who} : ${plural(t.marks, 'marque')}`, t.marks >= 6 ? 'gold' : t.marks >= 4 ? 'good' : '');
    voice.say(t.marks ? plural(t.marks, 'marque') : 'Aucune marque');
  } else {
    toast(`${who} : ${t.hits}/${t.darts.length}`, t.hits === 3 ? 'good' : '');
    if (next) {
      const tg = clockSeq(g.opts)[st.leg.state.pos[st.leg.turn.p]];
      voice.say(`${multi ? pname(next) + ', ' : ''}${tg === 25 ? 'au Bull' : 'au ' + tg}`);
    }
  }
}

const fold = s => String(s ?? '').normalize('NFD').replace(/\p{M}/gu, '').toLowerCase().trim();

const deN = n => (/^[aeiouyàâäéèêëîïôöùûüœæ]/i.test(n) ? "d'" : 'de ') + n;
const inCurrentGame = id => !!(db.current && !db.current.finishedAt && db.current.players.some(p => p.id === id));
// Nombre de parties et date de la dernière, pour tous les profils en un seul passage
function profileUsage() {
  const u = new Map();
  for (const g of db.games) for (const p of g.players) {
    const e = u.get(p.id) || { games: 0, last: 0 };
    e.games++; e.last = Math.max(e.last, g.finishedAt || 0);
    u.set(p.id, e);
  }
  return id => u.get(id) || { games: 0, last: 0 };
}
function admMeta(p, u) {
  const bits = [u.games ? plural(u.games, 'partie') : 'aucune partie'];
  if (u.last) bits.push('dernière le ' + fmtDate(u.last));

function admStatusText(p) {

function filterAdmin() {

function archiveProfile(p, after) {
  confirmBox({ title: `Archiver ${p.name} ?`, text: 'Le joueur disparaît des listes et du choix des joueurs. Ses parties et ses stats sont conservées : tu peux le restaurer à tout moment depuis Réglages › Gérer les profils.', ok: 'Archiver' }, () => {
    p.deleted = true; persist.profiles(); after(); toast('Profil archivé');
